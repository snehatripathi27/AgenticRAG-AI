[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlab-eval"
version = "0.1.0"
description = "Repeatable language model evaluations, from terminal to workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "rich>=13,<15", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.45,<5", "accelerate>=0.34,<2"]
vllm = ["vllm>=0.6,<1"]
benchmarks = ["datasets>=3,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
benchlab = "benchlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110
